<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archived Courses (Teacher) - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/tCourse.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>

    <div class="navigationBar">
        <span class="logo">
            <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toTStudents()">Students</button>
            <button onclick="toLesson()">Lesson</button>
            <button onclick="toTCourse()">Course</button>
            <button onclick="toTClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="toolbar">
        <a href="create_tCourse.html" class="add-course-btn" aria-label="Create Course">+</a>
        <button type="button" id="editToggle" class="edit-course-btn">Edit</button>
    </div>

    <h3 style="margin-left: 12px; font-size: 35px;">Archived Courses</h3>

    <ul id="CourseList"></ul>

    <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="overlayTitle" class="overlay-title">Edit Course</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="selectAllChk">
                    <span>Select All</span>
                </label>
            </div>
            <div id="overlayBody" class="overlay-body">
                <div class="muted">Loading courses...</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="deleteSelected" class="danger-btn">Delete Selected</button>
                <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/EduPilot/JavaScript/archivedCourses.js"></script>
    <script src="/EduPilot/JavaScript/admin-nav.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const studentsButton = document.querySelector('button[onclick="toTStudents()"]');
            if (studentsButton && isAdminModeActive()) {
                studentsButton.style.display = 'none';
            }
        });
    </script>
</body>
</html>
