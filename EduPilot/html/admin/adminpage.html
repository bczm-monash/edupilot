<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Page</title>
    <link rel="stylesheet" href="../../css/page.css" />
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>

    <div class="navigationBar">
        <span class="logo">
            <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toAdmin()">Admin</button>
            <button onclick="toAdminLesson()">Lesson</button>
            <button onclick="toAdminCourse()">Course</button>
            <button onclick="toAdminClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <main class="admin-dashboard">
        <h3 style="margin-left: 12px; font-size: 35px;">Admin Control</h3>

        <section class="card-grid" aria-label="Admin quick actions">
            <article class="admin-card" role="button" tabindex="0" data-action="toAdminStudentList">
                <h3>Student List</h3>
                <p>Manage students in the system.</p>
            </article>

            <article class="admin-card" role="button" tabindex="0" data-action="toAdminInstructorList">
                <h3>Instructor List</h3>
                <p>Manage instructors in the system.</p>
            </article>

            <article class="admin-card" role="button" tabindex="0" data-action="toAdminReports">
                <h3>Reports</h3>
                <p>View overall course, classroom, lesson and system analytics.</p>
            </article>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.admin-card[data-action]').forEach((card) => {
                const actionName = card.dataset.action;
                const handler = window[actionName];
                if (typeof handler !== 'function') return;

                const invoke = () => handler();

                card.addEventListener('click', invoke);
                card.addEventListener('keypress', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        invoke();
                    }
                });
            });
        });
    </script>
</body>
</html>
