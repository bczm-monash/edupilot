<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css">
  <link rel="stylesheet" href="../../css/list_Students.css"> <!-- reuse lesson CSS -->
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
  <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>
<body data-students-context="admin">
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toAdmin()">Admin</button>
      <button onclick="toAdminLesson()">Lesson</button>
      <button onclick="toAdminCourse()">Course</button>
      <button onclick="toAdminClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button type="button" class="secondary-btn back-btn" onclick="toAdmin()">Back</button>
    <button type="button" id="editToggle" class="edit-btn">Edit</button>
  </div>

  <h3 style="margin-left: 12px; font-size: 35px;">Students</h3>
  <table id="studentTable" border="1" cellspacing="0" cellpadding="8">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="studentList"></tbody>
</table>

  <!-- Overlay for edit mode -->
  <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h4 id="overlayTitle" class="overlay-title">Edit Students</h4>
          <input type="checkbox" id="selectAllChk">
          <span>Select All</span>
        </label>
      </div>
      <div id="overlayBody" class="overlay-body">
        <div class="muted">Loading students…</div>
      </div>
      <div class="overlay-actions">
        <button type="button" id="deleteSelected" class="danger-btn">Delete Selected</button>
        <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/EduPilot/JavaScript/list_students.js"></script>
  
</body>
</html>
