<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Admin</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/reports.css">
  <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toAdmin()">Admin</button>
      <button onclick="toAdminLesson()">Lesson</button>
      <button onclick="toAdminCourse()">Course</button>
      <button onclick="toAdminClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>
  <main class="admin-dashboard">
    <div class="admin-back">
      <button type="button" class="secondary-btn" onclick="toAdmin()">Back</button>
    </div>
    <h2>Reports</h2>
    <ul id="reportsList">
      <li class="report-card">
        <button class="report-btn">Course Report</button>
        <p>Analyze course engagement and completion rates.</p>
      </li>

      <li class="report-card">
        <button class="report-btn">Classroom Report</button>
        <p>Evaluate instructor activities and course feedback.</p>
      </li>
    </ul>
  </main>
</body>
</html>
