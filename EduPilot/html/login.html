<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/login.js"></script>
</head>
<body>
    <span class="logo">
        <img src ="../Images/logo.webp" alt="EduPilot logo" width = 150>
        <h1>EduPilot</h1>
    </span>

    <div class = "loginbox">
        <p class = "highlight">Please enter your details<p>
        <h2>Welcome back</h2>

        <form onsubmit="return false;">
        <div class = "fields">
            <input id = "email" type = "email" placeholder="Enter email address" required>
        </div>
        <div class = "fields">
            <input id = "password" type = "password" placeholder = "Enter password" required>
        </div>
        <button type="button" onclick="signIn(event)">Login</button>
        </form>

        <p class = "highlight", class = "signup-link"> Don't have an account? 
        <a href="#" onclick = "toRegister()">Sign up</a></p>
        
    </div>

</body>
</html>
