<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/sClassroom.css">
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>
<body>

    <div class = "navigationBar">
        <span class="logo">
            <img src ="../../Images/logo.webp" alt="EduPilot logo" width = 100>
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toSCourse()">Course</button>
            <button onclick="toSClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="toolbar">
        <a href="#" id="viewAvailableBtn" class="enroll-classroom-btn" aria-label="Available Classrooms">Available Classrooms</a>
        <button type="button" id="openUnenrollOverlay" class="classroom-action-btn unenroll" aria-label="Unenroll Classroom">Unenroll Classroom</button>
    </div>

    <h3 style="margin-left: 12px; font-size: 35px;">Classroom</h3>
    <ul id="classroomList" class="classroom-list"></ul>

        <div id="unenrollOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="unenrollOverlayTitle">
            <div class="overlay-panel">
                <div class="overlay-header">
                    <h4 id="unenrollOverlayTitle" class="overlay-title">Unenroll Classroom</h4>
                    <label class="overlay-select-all">
                        <input type="checkbox" id="unenrollSelectAll">
                        <span>Select All</span>
                    </label>
                </div>
                <div id="unenrollOverlayBody" class="overlay-body">
                    <div class="muted">Loading classrooms...</div>
                </div>
                <div class="overlay-actions">
                    <button type="button" id="confirmUnenroll" class="green-btn" style="background-color:#d9534f;">Unenroll Selected</button>
                    <button type="button" id="cancelUnenroll" class="secondary-btn">Cancel</button>
                </div>
            </div>
        </div>

  <script src="/EduPilot/JavaScript/sClassroom.js"></script>
</body>
</html>
