<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/sClassroom.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>
<body>

    <div class = "navigationBar">
        <span class="logo">
            <img src ="../../Images/logo.webp" alt="EduPilot logo" width = 100>
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toSCourse()">Course</button>
            <button>Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="toolbar">
        <a href="#" onclick="toUnenrolledClassroom()" class="enroll-classroom-btn" aria-label="See Unenrolled Classroom">See Unenrolled Classroom</a>
        <a href="#" onclick="toEnrollClassroom()" class="enroll-classroom-btn" aria-label="Enroll Classroom">Enroll Classroom</a>
    </div>

    <h3 style="margin-left: 12px; font-size: 35px;">Classroom</h3>
    <ul id="ClassroomList"></ul>

    <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="overlayTitle" class="overlay-title">Enroll Classroom</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="selectAllChk">
                    <span>Select All</span>
                </label>
            </div>
            <div id="overlayBody" class="overlay-body">
                <div class="muted">Loading classrooms…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="addSelected" class="green-btn">Add Selected</button>
                <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
            </div>
        </div>
  </div>

  <script>
  function toEnrollClassroom() {
    document.getElementById("editOverlay").style.display = "flex";
  }

  document.getElementById("closeOverlay").addEventListener("click", () => {
    document.getElementById("editOverlay").style.display = "none";
  });
  </script>
</body>
</html>
