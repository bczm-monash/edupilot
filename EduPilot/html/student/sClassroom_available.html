<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Classrooms - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/sCourse_available.css">
    <link rel="stylesheet" href="../../css/sClassroom.css">
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script src="/EduPilot/JavaScript/search_display_name.js"></script>
</head>
<body>

    <div class = "navigationBar">
        <span class="logo">
            <img src ="../../Images/logo.webp" alt="EduPilot logo" width = 100>
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toSCourse()">Course</button>
            <button onclick="toSClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="header-row">
        <button class="back-btn" onclick=toSClassroom()>← Back</button>
        <button type="button" id="openEnrollOverlay" class="enroll-btn">Enroll Classrooms</button>
    </div>
    <h3 style="margin-left: 12px; font-size: 35px;">Available Classrooms</h3>
    <ul id="CourseList"></ul>

    <div id="enrollOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="availableOverlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="availableOverlayTitle" class="overlay-title">Enroll Classrooms</h4>
                <label class="overlay-select-all">
                    <input type="checkbox" id="availableSelectAll">
                    <span>Select All</span>
                </label>
            </div>
            <div id="availableOverlayBody" class="overlay-body">
                <div class="muted">Loading classrooms…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="confirmAvailableEnroll" class="green-btn">Enroll Selected</button>
                <button type="button" id="cancelAvailableEnroll" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/EduPilot/JavaScript/sClassroom_available.js"></script>

</body>
</html>
