<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Content - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/sClassroom.css" />
  <link rel="stylesheet" href="../../css/sClassroom_content.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toSCourse()">Course</button>
      <button onclick="toSClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class = "wrapper side-panel-open">
    <div class="side-panel">
        <div class="page-container">
          <div class="form-card details-card">
            <ul class="details-list">
              <li id="rowClassName"><span class="details-key">Classroom Name:</span> <span id="valClassName" class="details-value"></span></li>
              <li id="rowClassID"><span class="details-key">Classroom ID:</span> <span id="valClassID" class="details-value"></span></li>
              <li id="rowInstructor"><span class="details-key">Instructor:</span> <span id="valInstructor" class="details-value"></span></li>
              <li id="rowStart"><span class="details-key">Start date:</span> <span id="valStart" class="details-value"></span></li>
              <li id="rowEnd"><span class="details-key">End date:</span> <span id="valEnd" class="details-value"></span></li>
              <li id="rowCourseID"><span class="details-key">Course ID:</span> <span id="valCourseID" class="details-value"></span></li>
              <li id="rowModified"><span class="details-key">Last Modified:</span> <span id="valModified" class="details-value"></span></li>
              <li id="rowCreated"><span class="details-key">Created Date:</span> <span id="valCreated" class="details-value"></span></li>
            </ul>
          </div>
        </div>
    </div>
    <button class="side-panel-toggle" type = "button">
      <span class="material-symbols-outlined sp-icon-open">keyboard_double_arrow_right</span>
      <span class="material-symbols-outlined sp-icon-close">keyboard_double_arrow_left</span>
    </button>
    <div class="main">
      <div class="back-bar">
        <button class="back-btn" onclick=toSClassroom()>← Back</button>
      </div>
      <h2>Lesson List</h2>
    </div>
  </div>

  <script>
    document.querySelector(".side-panel-toggle").addEventListener("click", () => 
    {document.querySelector(".wrapper").classList.toggle("side-panel-open");});
  </script>

</body>
</html>
