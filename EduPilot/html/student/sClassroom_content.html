<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Content - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/sClassroom.css" />
  <link rel="stylesheet" href="../../css/sClassroom_content.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toSCourse()">Course</button>
      <button>Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class = "wrapper side-panel-open">
    <div class="side-panel">
        <div class="page-container">
          <div class="form-card details-card">
            <ul class="details-list">
              <li><span class="details-key">Classroom Title:</span> <span id="valTitle" class="details-value"></span></li>
              <li><span class="details-key">Classroom ID:</span> <span id="valId" class="details-value"></span></li>
              <li><span class="details-key">Course:</span> <span id="valCourse" class="details-value"></span></li>
              <li><span class="details-key">Instructor:</span> <span id="valInstructor" class="details-value"></span></li>
              <li><span class="details-key">Duration (days):</span> <span id="valDuration" class="details-value"></span></li>
              <li><span class="details-key">Start Date:</span> <span id="valStart" class="details-value"></span></li>
              <li><span class="details-key">End Date:</span> <span id="valEnd" class="details-value"></span></li>
            </ul>
          </div>

          <div class="form-card">
            <h3 class="section-title">Your Grades</h3>
            <p id="studentProgressValue" class="muted">Loading grades…</p>
            <ul id="studentGradeList" class="grade-list"></ul>
          </div>

          <div class="form-card">
            <h3 class="section-title">Student List</h3>
            <ol id="studentList" class="student-list"></ol>
          </div>
        </div>
    </div>
    <button class="side-panel-toggle" type = "button">
      <span class="material-symbols-outlined sp-icon-open">keyboard_double_arrow_right</span>
      <span class="material-symbols-outlined sp-icon-close">keyboard_double_arrow_left</span>
    </button>
    <div class="main">
      <div class="header-bar">
        <button class="back-btn" onclick="toSClassroom()">← Back</button>
      </div>
      <h1 id="classroomHeader" class="course-header-title">Classroom</h1>
      <h2 class="lesson-list-title">Lesson List</h2>
      <ul id="lessonList"></ul>
    </div>
  </div>
  
  <script>
    document.querySelector(".side-panel-toggle").addEventListener("click", () => {
      document.querySelector(".wrapper").classList.toggle("side-panel-open");
    });
  </script>
  <script src="/EduPilot/JavaScript/sClassroom_content.js"></script>
</body>
</html>
