<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Content - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/sCourse.css" />
  <link rel="stylesheet" href="../../css/sCourse_content.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button>Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class = "wrapper ">
    <div class="side-panel">
        <ul class="details-list">
          <li id="rowCourseIdTitle"><span class="details-key">Course:</span> <span id="valCourseID" class="details-value"></span> <span id="valCourseTitle" class="details-value"></span></li>
          <li id="rowCreditCourse"><span class="details-key">Credit Points:</span> <span id="valCreditPoint" class="details-value"></span></li>
          <li id="rowCreatorCourse"><span class="details-key">Creator:</span> <span id="valCreatorCourse" class="details-value"></span></li>
          <li id="rowDetailsCourse"><span class="details-key">Description:</span> <span id="valCourseDescription" class="details-value"></span></li>
          <li id="rowCreatedCourse"><span class="details-key">Status:</span> <span id="valStatus" class="details-value"></span></li>
          <li id="rowModifiedCourse"><span class="details-key">Last Modified:</span> <span id="valModifiedCourse" class="details-value"></span></li>
          <li id="rowCreatedCourse"><span class="details-key">Created Date:</span> <span id="valCourseDate" class="details-value"></span></li>
    </div>
    <button class="side-panel-toggle" type = "button">
      <span class="material-symbols-outlined sp-icon-open">keyboard_double_arrow_right</span>
      <span class="material-symbols-outlined sp-icon-close">keyboard_double_arrow_left</span>
    </button>
    <div class="main">
      <h2>Lesson List</h2>
    </div>
  </div>
  

  <script>
    document.querySelector(".side-panel-toggle").addEventListener("click", () => 
    {document.querySelector(".wrapper").classList.toggle("side-panel-open");});
  </script>
</body>
</html>
