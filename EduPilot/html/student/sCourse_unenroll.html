<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unenrolled Course - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/sCourse_unenroll.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/search_display_name.js"></script>
</head>
<body>

    <div class = "navigationBar">
        <span class="logo">
            <img src ="../../Images/logo.webp" alt="EduPilot logo" width = 100>
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toSCourse()">Course</button>
            <button>Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="header-row">
        <button class="back-btn" onclick=toSCourse()>← Back</button>
        <button class="enroll-btn" id="openEnrollOverlay" type="button">Enroll Courses</button>
    </div>
    <h3 style="margin-left: 12px; font-size: 35px;">Unenrolled Course</h3>
    <ul id="CourseList"></ul>

    <div id="enrollOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="enrollOverlayTitle">
      <div class="overlay-panel">
        <div class="overlay-header">
          <h4 id="enrollOverlayTitle" class="overlay-title">Enroll Courses</h4>
          <label class="overlay-select-all">
            <input type="checkbox" id="enrollSelectAll">
            <span>Select All</span>
          </label>
        </div>
        <div id="enrollOverlayBody" class="overlay-body">
          <div class="muted">Loading courses...</div>
        </div>
        <div class="overlay-actions">
          <button type="button" id="confirmEnroll" class="green-btn">Enroll Selected</button>
          <button type="button" id="cancelEnroll" class="secondary-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/EduPilot/JavaScript/scourse-unenroll.js"></script>
</body>
</html>
