<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Courses - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css">
  <link rel="stylesheet" href="../../css/sCourse_available.css">
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
  <script src="/EduPilot/JavaScript/search_display_name.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toTeacherAdmin()">Admin</button>
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class="header-row">
    <button class="back-btn" type="button" onclick="toTCourse()">← Back</button>
    <h2 style="margin: 0;">Archived Courses</h2>
  </div>

  <ul id="CourseList"></ul>

  <script src="/EduPilot/JavaScript/archivedCourses.js"></script>
  <script src="/EduPilot/JavaScript/admin-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const adminButton = document.querySelector('button[onclick=\"toTeacherAdmin()\"]');
      if (adminButton && isAdminModeActive()) {
        adminButton.style.display = 'none';
      }
    });
  </script>
</body>
</html>
