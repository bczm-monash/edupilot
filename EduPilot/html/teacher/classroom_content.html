<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Content - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/tClassroom.css" />
  <link rel="stylesheet" href="../../css/tClassroom_content.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class = "wrapper side-panel-open">
    <div class="side-panel">
        <div class="page-container">
          <div class="form-card details-card">
            <ul class="details-list">
              <li><span class="details-key">Classroom Title:</span> <span id="valTitle" class="details-value"></span></li>
              <li><span class="details-key">Classroom ID:</span> <span id="valId" class="details-value"></span></li>
              <li><span class="details-key">Course:</span> <span id="valCourse" class="details-value"></span></li>
              <li><span class="details-key">Instructor:</span> <span id="valInstructor" class="details-value"></span></li>
              <li><span class="details-key">Duration (days):</span> <span id="valDuration" class="details-value"></span></li>
              <li><span class="details-key">Start Date:</span> <span id="valStart" class="details-value"></span></li>
              <li><span class="details-key">End Date:</span> <span id="valEnd" class="details-value"></span></li>
            </ul>
          </div>

          <div class="form-card">
            <h3 class="section-title">Student List</h3>
            <ol id="studentList" class="student-list"></ol>
          </div>
        </div>
    </div>
    <button class="side-panel-toggle" type = "button">
      <span class="material-symbols-outlined sp-icon-open">keyboard_double_arrow_right</span>
      <span class="material-symbols-outlined sp-icon-close">keyboard_double_arrow_left</span>
    </button>
    <div class="main">
      <div class="toolbar">
        <a href="#" id="openAddLessons" class="add-lesson-btn" aria-label="Add Lesson">Add</a>
        <a href="#" id="openRemoveLessons" class="delete-lesson-btn" aria-label="Delete Lesson">Remove</a>
        <button type="button" id="openGrades" class="flat-btn">Grades</button>
        <button type="button" id="editClassroomBtn" class="edit-classroom-btn">Edit</button>
      </div>
      <div class="header-bar">
        <button class="back-btn" onclick="toTClassroom()">← Back</button>
      </div>
      <h1 id="classroomHeader" class="course-header-title">Classroom</h1>
      <h2 class="lesson-list-title">Lesson List</h2>
      <ul id="lessonList"></ul>
    </div>
  </div>
  
  <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="overlayTitle" class="overlay-title">Remove Lessons</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="selectAllChk">
                    <span>Select All</span>
                </label>
            </div>
            <div id="overlayBody" class="overlay-body">
                <div class="muted">Loading lessons…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="deleteSelected" class="danger-btn">Delete Selected</button>
                <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
            </div>
        </div>
  </div>
  
  <div id="editOverlay2" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="addOverlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="addOverlayTitle" class="overlay-title">Add Lessons</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="addSelectAll">
                    <span>Select All</span>
                </label>
            </div>
            <div id="addOverlayBody" class="overlay-body">
                <div class="muted">Loading lessons…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="addSelected" class="green-btn">Add Selected</button>
                <button type="button" id="closeOverlay2" class="secondary-btn">Cancel</button>
            </div>
        </div>
  </div>

  <script>
    document.querySelector(".side-panel-toggle").addEventListener("click", () => {
      document.querySelector(".wrapper").classList.toggle("side-panel-open");
    });
  </script>
  <script src="/EduPilot/JavaScript/classroom-content.js"></script>
  <script src="/EduPilot/JavaScript/admin-nav.js"></script>
</body>
</html>
