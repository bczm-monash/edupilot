<!DOCTYPE html> <!--lesson creating page-->
<html lang="en">
<head> 
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../css/creatingpage.css">
</head>
<body>
    <div class="navigationBar">
        <span class="logo">
            <img src="EduPilot/Images/logo.webp" alt="EduPilot logo" width="100">
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toLesson()">Lesson</button>
            <button onclick="toClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>
    
    <div class="page-container">
        <h1>Teachers Creating Page</h1>
        <h2>Create Lesson</h2>
        <form id="lessonForm">
            <label>Lesson ID:
                <input type="text" id="lessonID" required>
            </label>
            <label>Lesson Title:
                <input type="text" id="lessonTitle" required>
            </label>
            <label>Lesson Description:
                <input type="text" id="lessonDescription" required>
            </label>
            <label>Lesson Objective:
                <input type="text" id="lessonObjective" required>
            </label>
            <label>Estimated Hours:
                <input type="text" id="estimatedHours" required>
            </label>
            <label>Prerequisites:
                <input type="text" id="prerequisite" placeholder="None">
            </label>
            <label>Owner:
                <input type="text" id="owner" required>
            </label>
            <label>Credit Points:
                <input type="text" id="creditPoints" required>
            </label>
        </form>
    </div>
</body>
</html>
