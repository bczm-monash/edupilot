<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Course - EduPilot </title>
    <link rel="stylesheet" href="../../css/page.css" />
    <link rel="stylesheet" href="../../css/create_course.css" />
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script src="/EduPilot/JavaScript/create-course.js"></script>
  </head>
  
  <body>
    <div class="navigationBar">
      <span class="logo">
        <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
        <h1>EduPilot</h1>
      </span>
      <div class="menu">
        <button onclick="toLesson()">Lesson</button>
        <button onclick="toTCourse()">Course</button>
        <button onclick="toTClassroom()">Classroom</button>
        <button onclick="toLogin()">Log Out</button>
      </div>
    </div>

    <div class="page-container">
      <div class="form-card">
        <h2 class="form-title">Create Course</h2>
        <p class="form-subtitle">Enter details to add a new course.</p>

        <form id="createCourseForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="courseId">Course ID</label>
              <input type="text" id="courseId" name="courseId" placeholder="Course ID" required />
            </div>

            <div class="form-group">
              <label for="courseTitle">Title</label>
              <input type="text" id="courseTitle" name="courseTitle" placeholder="What is this course?" required />
            </div>

            <div class="form-group full-width">
              <label for="courseDescription">Description</label>
              <textarea id="courseDescription" name="courseDescription" placeholder="What is the course about?" required></textarea>
            </div>

            <div class="form-group full-width">
              <label for="selectedLessonsDisplay">Lessons</label>
              <div class="selected-lessons-row">
                <textarea id="selectedLessonsDisplay" placeholder="No lessons selected" readonly></textarea>
                <button type="button" id="openLessonOverlay" class="btn-tertiary">Add Lessons</button>
              </div>
              <input type="hidden" id="courseLessons" name="courseLessons" />
              <input type="hidden" id="courseTotalCreditPoints" name="courseTotalCreditPoints" />
            </div>

            <div class="form-group">
              <label for="courseStatus">Status</label>
              <select id="courseStatus" name="courseStatus" required>
                    <option value="" disabled selected>--Select course's status--</option>
                    <option value="draft">Draft</option>
                    <option value="published">Publish</option>
                    <option value="archived">Archive</option>
              </select>
            </div>

            <div class="form-group">
              <label for="courseCreditPoints">Credit Points</label>
              <input type="number" id="courseCreditPoints" name="courseCreditPoints" min="0" step="1" value="0" readonly />
            </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Create Course</button>
            <button type="button" class="btn-secondary" onclick="toTCourse()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="lessonOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="lessonOverlayTitle">
      <div class="overlay-panel">
        <div class="overlay-header">
          <h4 id="lessonOverlayTitle" class="overlay-title">Add Lessons</h4>
          <button type="button" id="closeLessonOverlay" class="close-overlay-btn" aria-label="Close">&times;</button>
        </div>
        <div id="lessonOverlayBody" class="overlay-body">
          <div class="muted">Loading lessons...</div>
        </div>
        <div class="overlay-actions">
          <button type="button" id="applyLessonSelection" class="btn-primary">Add Selected</button>
          <button type="button" id="cancelLessonSelection" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </body>
  </html>
