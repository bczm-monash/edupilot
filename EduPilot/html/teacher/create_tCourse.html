<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Course</title>
    <link rel="stylesheet" href="../../css/page.css" />
    <link rel="stylesheet" href="../../css/create_course.css" />
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script src="/EduPilot/JavaScript/create-course.js"></script>
  </head>
  
  <body>
    <div class="navigationBar">
      <span class="logo">
        <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
        <h1>EduPilot</h1>
      </span>
      <div class="menu">
        <button onclick="toLesson()">Lesson</button>
        <button onclick="toTCourse()">Course</button>
        <button>Classroom</button>
        <button onclick="toLogin()">Log Out</button>
      </div>
    </div>

    <div class="page-container">
      <div class="form-card">
        <h2 class="form-title">Create Course</h2>
        <p class="form-subtitle">Enter details to add a new course.</p>

        <form id="createCourseForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="lessonId">Course ID</label>
              <input type="text" id="lessonId" name="lessonId" placeholder="Course ID" required />
            </div>

            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" placeholder="What is this course?" required />
            </div>

            <div class="form-group full-width">
              <label for="description">Description</label>
              <textarea id="description" name="description" placeholder="What is the course about?" required></textarea>
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select id = "status" name = "status" required>
                    <option value ="" disabled selected>--Select course's status--</option>
                    <option value = "Student">Publish</option>
                    <option value = "Teacher">Draft</option>
                    <option value = "Teacher">Archive</option>
              </select>
            </div>

            <div class="form-group">
              <label for="initialCreditPoints">Credit Points</label>
              <input type="number" id="initialCreditPoints" name="creditPoints" min="0" step="1" value="0" readonly/>
            </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Create Course</button>
            <button type="button" class="btn-secondary" onclick="">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </body>
  </html>
