<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Classroom - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/create_classroom.css" />
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script src="/EduPilot/JavaScript/edit-lesson.js"></script>
</head>

<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
        <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class="page-container">
      <div class="form-card">
        <h2 class="form-title">Edit Classroom</h2>
        <p class="form-subtitle">Update details to edit the classroom.</p>

        <form id="createCourseForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="ClassroomID">Classroom ID</label>
              <input type="text" id="ClassroomID" name="ClassroomID" placeholder="ID of the classroom" required />
            </div>

            <div class="form-group">
              <label for="ClassroomName">Classroom name</label>
              <input type="text" id="ClassroomName" name="Classroom Name" placeholder="Name of the classroom" required />
            </div>

            <div class="form-group">
              <label for="start">Start date</label>
              <input type="text" id="start" name="start" placeholder="What is the start date of the classroom?" required />
            </div>

            <div class="form-group">
              <label for="duration">End date</label>
              <input type="text" id="Duration" name="Duration" placeholder="e.g. DD/MM/YYYY" required />
            </div>

            <div class="form-group">
              <label for="courseID">CourseID</label>
              <select id = "courseID" name = "courseID" required>
                    <option value ="" disabled selected>--Select course you want to teach--</option>
              </select>
            </div>

            <div class="form-group">
              <label for="Lessons">Lessons</label>
              <select id = "Lessons" name = "Lessons" required>
                    <option value ="" disabled selected>--Select lessons you want to teach--</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="list">List of students</label>
              <textarea id="list" name="list" placeholder="List of the student" required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Update Classroom</button>
                <button type="button" class="btn-secondary" onclick="toTClassroom()">Cancel</button>
            </div>
        </form>
      </div>
  </div>
</body>
</html>
