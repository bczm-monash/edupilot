<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Classroom - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <link rel="stylesheet" href="../../css/create_classroom.css" />
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
  <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>

<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
        <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <div class="page-container">
      <div class="form-card">
        <h2 class="form-title">Edit Classroom</h2>
        <p class="form-subtitle">Update details to edit the classroom.</p>

        <form id="editClassroomForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="ClassroomID">Classroom ID</label>
              <input type="text" id="ClassroomID" name="ClassroomID" placeholder="ID of the classroom" required readonly />
            </div>

            <div class="form-group">
              <label for="ClassroomName">Classroom name</label>
              <input type="text" id="ClassroomName" name="Classroom Name" placeholder="Name of the classroom" required />
            </div>

            <div class="form-group">
              <label for="start">Start date</label>
              <input type="date" id="start" name="start" required />
            </div>

            <div class="form-group">
              <label for="Duration">End date</label>
              <input type="date" id="Duration" name="Duration" required />
            </div>

            <div class="form-group">
              <label for="courseID">Course</label>
              <select id = "courseID" name = "courseID" required>
                    <option value ="" disabled selected>--Select course you want to teach--</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="classroomLessonsDisplay">Lessons</label>
              <div class="selected-lessons-row">
                <textarea id="classroomLessonsDisplay" placeholder="No lessons selected" readonly></textarea>
                <button type="button" id="openClassroomLessonOverlay" class="btn-tertiary">Select Lessons</button>
              </div>
              <input type="hidden" id="classroomLessons" name="Lessons" />
            </div>

            <div class="form-group full-width">
              <label for="classroomStudentsDisplay">Students</label>
              <div class="selected-lessons-row">
                <textarea id="classroomStudentsDisplay" placeholder="No students selected" readonly></textarea>
                <button type="button" id="openClassroomStudentOverlay" class="btn-tertiary">Select Students</button>
              </div>
              <input type="hidden" id="classroomStudents" name="list" />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Update Classroom</button>
                <button type="button" class="btn-secondary" onclick="toTClassroom()">Cancel</button>
            </div>
        </form>
      </div>
  </div>

  <div id="classroomLessonOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="classroomLessonOverlayTitle">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h4 id="classroomLessonOverlayTitle" class="overlay-title">Select Lessons</h4>
        <button type="button" id="closeClassroomLessonOverlay" class="close-overlay-btn" aria-label="Close">&times;</button>
      </div>
      <div id="classroomLessonOverlayBody" class="overlay-body">
        <div class="muted">Select a course to view lessons.</div>
      </div>
      <div class="overlay-actions">
        <button type="button" id="applyClassroomLessonSelection" class="btn-primary">Apply</button>
        <button type="button" id="cancelClassroomLessonSelection" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="classroomStudentOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="classroomStudentOverlayTitle">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h4 id="classroomStudentOverlayTitle" class="overlay-title">Select Students</h4>
        <button type="button" id="closeClassroomStudentOverlay" class="close-overlay-btn" aria-label="Close">&times;</button>
      </div>
      <div id="classroomStudentOverlayBody" class="overlay-body">
        <div class="muted">Select a course to view enrolled students.</div>
      </div>
      <div class="overlay-actions">
        <button type="button" id="applyClassroomStudentSelection" class="btn-primary">Apply</button>
        <button type="button" id="cancelClassroomStudentSelection" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/EduPilot/JavaScript/load-teacher-courses.js"></script>
  <script src="/EduPilot/JavaScript/classroom-lesson-picker.js"></script>
  <script src="/EduPilot/JavaScript/edit-classroom.js"></script>
  <script src="/EduPilot/JavaScript/admin-nav.js"></script>
</body>
</html>
