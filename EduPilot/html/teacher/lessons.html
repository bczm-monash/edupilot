<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    <style>
      /* local css */
        .toolbar { margin: 12px; display: flex; gap: 8px; justify-content: flex-end; }
        .edit-lesson-btn {
            display: inline-block;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #6c757d;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .edit-lesson-btn:hover { background-color: #5a6268; }

        .overlay-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .overlay-panel {
            background: #fff;
            width: min(700px, 92vw);
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; }
        .overlay-title { margin: 0; font-size: 20px; }
        .overlay-body { margin-top: 12px; overflow: auto; border: 1px solid #eee; border-radius: 8px; padding: 8px; }
        .overlay-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
        .list-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #f2f2f2; }
        .list-row:last-child { border-bottom: 0; }
        .danger-btn { background-color: #d9534f; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; cursor: pointer; }
        .danger-btn:hover { background-color: #c9302c; }
        .secondary-btn { background-color: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
        .muted { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <!-- Navigation bar duplicated from tCourse.html -->
    <div class="navigationBar">
        <span class="logo">
            <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toLesson()">Lesson</button>
            <button onclick="">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <!-- Action buttons below navbar, aligned left -->
    <div class="toolbar">
        <a href="#" onclick="toCreateLesson()" class="add-lesson-btn" aria-label="Create Lesson">+</a>
        <button type="button" id="editToggle" class="edit-lesson-btn">Edit</button>
    </div>

    <h3 style="margin-left: 12px;">Lessons List</h3>
    <ul id="lessonList"></ul>

    <!-- Edit overlay for selecting and deleting lessons -->
    <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="overlayTitle" class="overlay-title">Edit Lessons</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="selectAllChk">
                    <span>Select All</span>
                </label>
            </div>
            <div id="overlayBody" class="overlay-body">
                <div class="muted">Loading lessons…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="deleteSelected" class="danger-btn">Delete Selected</button>
                <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/EduPilot/JavaScript/lessons.js"></script>

    <script>
      (function () {
        const overlay = document.getElementById('editOverlay');
        const overlayBody = document.getElementById('overlayBody');
        const selectAllChk = document.getElementById('selectAllChk');
        const deleteBtn = document.getElementById('deleteSelected');
        const closeBtn = document.getElementById('closeOverlay');
        const editToggle = document.getElementById('editToggle');

        function getRenderedLessons() {
          const list = document.getElementById('lessonList');
          if (!list) return [];
          const items = Array.from(list.querySelectorAll('li.lesson-card'));
          return items.map(li => ({
            id: li.dataset.id || '',
            title: (li.querySelector('.lesson-title')?.textContent || 'Lesson').trim(),
          }));
        }

        function buildOverlayList() {
          const lessons = getRenderedLessons();
          overlayBody.innerHTML = '';
          if (!lessons.length) {
            const empty = document.createElement('div');
            empty.className = 'muted';
            empty.textContent = 'No lessons available.';
            overlayBody.appendChild(empty);
            return;
          }
          const frag = document.createDocumentFragment();
          lessons.forEach(ls => {
            const row = document.createElement('div');
            row.className = 'list-row';
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.className = 'row-chk';
            chk.dataset.id = ls.id;
            const label = document.createElement('label');
            label.textContent = ls.title;
            label.style.flex = '1';
            row.appendChild(chk);
            row.appendChild(label);
            frag.appendChild(row);
          });
          overlayBody.appendChild(frag);
          selectAllChk.checked = false;
        }

        function openOverlay() {
          buildOverlayList();
          overlay.style.display = 'flex';
        }

        function closeOverlay() {
          overlay.style.display = 'none';
        }

        function selectedIds() {
          return Array.from(overlayBody.querySelectorAll('input.row-chk:checked')).map(c => c.dataset.id).filter(Boolean);
        }

        async function deleteFromSupabase(ids) {
          if (!window.supabase || !ids.length) return { ok: false, tried: false };
          try {
            // First try delete by 'id'
            const { error: e1 } = await window.supabase.from('lesson').delete().in('id', ids);
            if (!e1) return { ok: true, tried: true };
            // Fallback: try by 'lesson_id'
            const { error: e2 } = await window.supabase.from('lesson').delete().in('lesson_id', ids);
            if (!e2) return { ok: true, tried: true };
            console.warn('Delete failed by both id and lesson_id', e1, e2);
            return { ok: false, tried: true };
          } catch (err) {
            console.error('Supabase delete error', err);
            return { ok: false, tried: true };
          }
        }

        async function handleDeleteSelected() {
          const ids = selectedIds();
          if (!ids.length) { alert('Please select at least one lesson.'); return; }

          // Remove from current UI list
          const list = document.getElementById('lessonList');
          ids.forEach(id => {
            const li = list.querySelector(`li.lesson-card[data-id="${CSS.escape(id)}"]`);
            if (li) li.remove();
          });

          // Attempt backend delete (best-effort)
          const result = await deleteFromSupabase(ids);
          if (result.tried) {
            alert(result.ok ? 'Deleted from database.' : 'Failed to delete from database.');
          }

          // Refresh overlay list to reflect removal
          buildOverlayList();
        }

        // Wire events
        editToggle?.addEventListener('click', openOverlay);
        closeBtn?.addEventListener('click', closeOverlay);
        overlay?.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });
        deleteBtn?.addEventListener('click', handleDeleteSelected);
        selectAllChk?.addEventListener('change', () => {
          const chks = overlayBody.querySelectorAll('input.row-chk');
          chks.forEach(c => c.checked = selectAllChk.checked);
        });
      })();
    </script>
</body>
</html>
