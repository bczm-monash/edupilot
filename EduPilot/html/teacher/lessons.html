<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lessons - EduPilot</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../css/lesson.css">
    
</head>
<div class = "navigationBar">
        <span class="logo">
            <img src ="EduPilot/Images/logo.webp" alt="EduPilot logo" width = 100>
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toLesson()">Lesson</button>
            <button onclick="toClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>

    </div>

<!-- Plus button redirects directly to teacher page -->
<a href="teacher_creating_page" class="add-lesson-btn">+</a>

<ul id="lessonList">
    <h3>Lessons List</h3>

    <li class="lesson-card">
        <button class="lesson-btn">
        <div class="lesson-title">MATH0101 - Math</div>
        <div class="lesson-meta">Owner: Alice</div>
        <div class="lesson-meta">Estimated Hour: 8</div>
        <div class="lesson-meta">Credit Point: 6</div>
    </button>
        <button class="delete-btn">Delete</button>
    </li>

    <li class="lesson-card">
        <button class="lesson-btn">
        <div class="lesson-title">ENG0101 - English</div>
        <div class="lesson-meta">Owner: Bob</div>
        <div class="lesson-meta">Estimated Hour: 8</div>
        <div class="lesson-meta">Credit Point: 6</div>
    </button>
        <button class="delete-btn">Delete</button>
    </li>
</ul>

<script>
    // Handle deleting lessons
    document.getElementById("lessonList").addEventListener("click", function(e) {
        if (e.target.classList.contains("delete-btn")) {
            e.target.parentElement.remove();
        }
    });

    function openLesson(lessonName) {
        alert("Opening " + lessonName);
    }
</script>

</body>
</html>
