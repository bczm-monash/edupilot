<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Admin - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css" />
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100" />
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toTeacherAdmin()">Admin</button>
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <main class="admin-dashboard">
    <h3 style="margin-left: 12px; font-size: 35px;">Teacher Admin</h3>
    <p class="muted" style="margin-left: 12px; margin-top: -12px;">
      Manage key teacher tools like student access and performance reports.
    </p>

    <section class="card-grid" aria-label="Teacher admin actions">
      <article class="admin-card" role="button" tabindex="0" data-action="toTStudents">
        <h3>Student List</h3>
        <p>Manage students in the system.</p>
      </article>

      <article class="admin-card" role="button" tabindex="0" data-action="toTeacherReports">
        <h3>Reports</h3>
        <p>View course, classroom, and lesson analytics.</p>
      </article>
    </section>
  </main>

  <script src="/EduPilot/JavaScript/admin-nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const adminButton = document.querySelector('button[onclick="toTeacherAdmin()"]');
      if (adminButton && isAdminModeActive()) {
        adminButton.style.display = 'none';
      }

      document.querySelectorAll('.admin-card[data-action]').forEach((card) => {
        const actionName = card.dataset.action;
        const handler = window[actionName];
        if (typeof handler !== 'function') return;

        const invoke = () => handler();

        card.addEventListener('click', invoke);
        card.addEventListener('keypress', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            invoke();
          }
        });
      });
    });
  </script>
</body>
</html>
