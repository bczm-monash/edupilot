<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom (Teacher) - EduPilot</title>
    <link rel="stylesheet" href="../../css/page.css">
    <link rel="stylesheet" href="../../css/tClassroom.css">
    <script src="/EduPilot/JavaScript/redirect.js"></script>
    <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
    
</head>
<body>
    <div class="navigationBar">
        <span class="logo">
            <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
            <h1>EduPilot</h1>
        </span>
        <div class="menu">
            <button onclick="toTeacherAdmin()">Admin</button>
            <button onclick="toLesson()">Lesson</button>
            <button onclick="toTCourse()">Course</button>
            <button onclick="toTClassroom()">Classroom</button>
            <button onclick="toLogin()">Log Out</button>
        </div>
    </div>

    <div class="toolbar">
        <a href="#" onclick="toCreateClassroom()" class="add-lesson-btn" aria-label="Create Lesson">+</a>
        <button type="button" id="viewArchivedClassrooms" class="edit-lesson-btn" onclick="toTeacherArchivedClassrooms()">Archived</button>
        <button type="button" id="editToggle" onclick="toEditClassroom()" class="edit-lesson-btn">Edit</button>
    </div>

    <h3 class="page-heading">Classrooms</h3>
    <ul id="classroomList" class="classroom-list"></ul>

    <div id="editOverlay" class="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h4 id="overlayTitle" class="overlay-title">Edit Classroom</h4>
                <label style="display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="selectAllChk">
                    <span>Select All</span>
                </label>
            </div>
            <div id="overlayBody" class="overlay-body">
                <div class="muted">Loading classroom…</div>
            </div>
            <div class="overlay-actions">
                <button type="button" id="deleteSelected" class="danger-btn">Delete Selected</button>
                <button type="button" id="closeOverlay" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/EduPilot/JavaScript/classroom-list.js"></script>
    <script src="/EduPilot/JavaScript/admin-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const adminButton = document.querySelector('button[onclick="toTeacherAdmin()"]');
            if (adminButton && isAdminModeActive()) {
                adminButton.style.display = 'none';
            }
        });
    </script>

</body>
</html>
