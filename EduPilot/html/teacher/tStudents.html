<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students (Teacher) - EduPilot</title>
  <link rel="stylesheet" href="../../css/page.css">
  <link rel="stylesheet" href="../../css/list_Students.css">
  <script src="/EduPilot/JavaScript/redirect.js"></script>
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toTStudents()">Students</button>
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button type="button" class="secondary-btn back-btn" onclick="toTCourse()">Back</button>
  </div>

  <h3 style="margin-left: 12px; font-size: 35px;">Students</h3>
  <table id="studentTable" border="1" cellspacing="0" cellpadding="8">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Enrolled Courses</th>
    </tr>
  </thead>
  <tbody id="studentList"></tbody>
</table>

  <script src="/EduPilot/JavaScript/list_students.js"></script>

</body>
</html>
