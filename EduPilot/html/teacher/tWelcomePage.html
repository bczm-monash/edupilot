<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - EduPilot Teacher</title>
  <link rel="stylesheet" href="../../css/page.css">
  <link rel="stylesheet" href="../../css/welcome_page.css">
  <script type="module" src="/EduPilot/JavaScript/supabase-init.js"></script>
  <script src="/EduPilot/JavaScript/redirect.js"></script>
</head>
<body>
  <div class="navigationBar">
    <span class="logo">
      <img src="../../Images/logo.webp" alt="EduPilot logo" width="100">
      <h1>EduPilot</h1>
    </span>
    <div class="menu">
      <button onclick="toTeacherAdmin()">Admin</button>
      <button onclick="toLesson()">Lesson</button>
      <button onclick="toTCourse()">Course</button>
      <button onclick="toTClassroom()">Classroom</button>
      <button onclick="toLogin()">Log Out</button>
    </div>
  </div>

  <main class="welcome-page">
    <section class="hero-card teacher-hero">
      <div class="hero-text">
        <p id="greeting" class="hero-greeting">Welcome, Instructor</p>
        <h1>Welcome back to EduPilot</h1>
        <p id="motivation" class="hero-quote">“The art of teaching is the art of assisting discovery.” — Mark Van Doren</p>
        <div class="hero-actions">
          <button type="button" class="primary-btn" id="createCourseBtn">Create Course</button>
          <button type="button" class="secondary-btn" id="createClassroomBtn">Launch Classroom</button>
        </div>
      </div>
    </section>

    <section class="stats-grid" aria-label="Teaching summary">
      <article class="stat-card">
        <h3>Courses</h3>
        <p id="courseCount" class="stat-value">0</p>
        <p class="stat-label">Active</p>
      </article>
      <article class="stat-card">
        <h3>Classrooms</h3>
        <p id="classroomCount" class="stat-value">0</p>
        <p class="stat-label">Running</p>
      </article>
      <article class="stat-card">
        <h3>Students</h3>
        <p id="studentCount" class="stat-value">0</p>
        <p class="stat-label">Enrolled</p>
      </article>
    </section>

  </main>

  <script src="/EduPilot/JavaScript/tWelcomePage.js"></script>
  <script src="/EduPilot/JavaScript/admin-nav.js"></script>
</body>
</html>
